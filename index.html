<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Galaxy Data Exploration</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <header>
    <h1>Galaxy Data Exploration</h1>
    <div class="controls">
      <input id="file-input" type="file" multiple />
      <select id="group-attribute"><option value="__auto">Auto / filename</option></select>
      <input id="search" placeholder="Search (name or property)" />
      <div id="filters"></div>
    </div>
  </header>

  <main>
    <div id="viz-wrap">
      <svg id="viz"></svg>
    </div>
    <aside id="details">
      <h2>Details</h2>
      <div id="details-content">Click a star to see details</div>
    </aside>
  </main>

  <div id="tooltip" class="hidden"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
